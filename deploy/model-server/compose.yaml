services:
  yolo-inference:
    build:
      context: ../..
      dockerfile: deploy/model-server/Dockerfile.yolo
    image: vision-platform/yolo-inference:latest
    container_name: vision-yolo-inference
    restart: unless-stopped
    gpus: all
    ports:
      - "${YOLO_INFERENCE_PORT:-8091}:8091"
    environment:
      INFERENCE_MODEL_STORAGE_ROOT: /models
      INFERENCE_API_KEY: ${YOLO_INFERENCE_API_KEY:?set in .env}
      INFERENCE_MAX_UPLOAD_MB: ${INFERENCE_MAX_UPLOAD_MB:-50}
      NVIDIA_VISIBLE_DEVICES: ${YOLO_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # The host path must contain the same relative hierarchy as the
      # application server's VISION_MODEL_STORAGE_ROOT.
      - ${MODEL_STORAGE_HOST_PATH:?set in .env}:/models:ro
    shm_size: "2gb"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).read()\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
